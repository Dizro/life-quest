version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lifequest_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lifequest_network

  redis:
    image: redis:7-alpine
    container_name: lifequest_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lifequest_network

  api:
    build:
      context: ./lifequest-backend
      dockerfile: Dockerfile
    image: ghcr.io/dizro/lifequest-api:latest
    container_name: lifequest_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lifequest_network
    restart: always

  worker:
    build:
      context: ./lifequest-backend
      dockerfile: Dockerfile
    image: ghcr.io/dizro/lifequest-api:latest
    container_name: lifequest_worker
    command: celery -A app.core.celery_app worker -B --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lifequest_network
    restart: always

  frontend:
    build:
      context: ./lifequest-frontend
      dockerfile: Dockerfile
    image: ghcr.io/dizro/lifequest-frontend:latest
    container_name: lifequest_frontend
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - lifequest_network
    restart: always

volumes:
  postgres_data:
  redis_data:

networks:
  lifequest_network:
    driver: bridge
